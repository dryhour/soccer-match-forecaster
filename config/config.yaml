# =============================================================================
# soccer-forecasting :: config.yaml
# Central configuration. Change values here rather than hardcoding in scripts.
# =============================================================================

project:
  name: "soccer-forecasting"
  timezone: "UTC"
  random_seed: 42

# -----------------------------------------------------------------------------
# Data sources
# -----------------------------------------------------------------------------
# football-data.co.uk is free, requires no API key/signup, and provides
# historical + current-season CSVs (results, odds, basic match stats) for
# most major European leagues going back 20+ years.
# URL pattern: https://www.football-data.co.uk/mmz4281/{season}/{code}.csv
#   season example: 2425  -> 2024/25 season
#   code example:   E0    -> English Premier League
data_sources:
  football_data_co_uk:
    base_url: "https://www.football-data.co.uk/mmz4281"
    # A single combined file of near-term scheduled fixtures (all leagues,
    # no season split) -- separate from the per-season historical results
    # above. Refreshed by the source periodically; typically covers the next
    # matchweek or two, not the full season in advance.
    fixtures_url: "https://www.football-data.co.uk/fixtures.csv"
    leagues:
      E0: "Premier League (England)"
      E1: "Championship (England)"
      SP1: "La Liga (Spain)"
      D1: "Bundesliga (Germany)"
      I1: "Serie A (Italy)"
      F1: "Ligue 1 (France)"

# Which leagues/seasons this project is currently tracking.
# Extend this list as you add leagues. Seasons use football-data.co.uk format.
active:
  leagues: ["E0"]
  seasons: ["2223", "2324", "2425", "2526"]   # 2022/23 .. 2025/26

# -----------------------------------------------------------------------------
# Paths (all relative to project root)
# -----------------------------------------------------------------------------
paths:
  bronze_matches: "data/bronze/matches"
  bronze_fixtures: "data/bronze/fixtures"
  bronze_players: "data/bronze/players"
  bronze_teams: "data/bronze/teams"
  bronze_lineups: "data/bronze/lineups"
  bronze_injuries: "data/bronze/injuries"
  bronze_leagues: "data/bronze/leagues"

  silver_matches: "data/silver/matches_clean"
  silver_fixtures: "data/silver/fixtures_clean"
  silver_players: "data/silver/players_clean"
  silver_teams: "data/silver/teams_clean"
  silver_lineups: "data/silver/lineups_clean"
  silver_injuries: "data/silver/injuries_clean"

  gold_match_features: "data/gold/match_features"
  gold_player_features: "data/gold/player_features"
  gold_team_features: "data/gold/team_features"
  gold_prediction_features: "data/gold/prediction_features"
  gold_derby_analysis: "data/gold/derby_analysis"

  models_dir: "models"
  predictions_dir: "data/gold/prediction_features"

# -----------------------------------------------------------------------------
# Feature engineering
# -----------------------------------------------------------------------------
features:
  # Rolling windows (# of matches) for "current form". The FIRST entry is the
  # window the model uses (baseline); the rest are computed so the backtest
  # can compare windows head-to-head (2026-10-03 experiment).
  form_windows: [5, 3, 10]
  min_matches_for_form: 3      # minimum matches before a form stat is considered reliable

# -----------------------------------------------------------------------------
# Modeling
# -----------------------------------------------------------------------------
model:
  baseline: "poisson"
  candidates: ["poisson", "logistic", "random_forest", "xgboost"]
  max_goals_simulated: 10      # cap for Poisson scoreline probability grid
  # L2 penalty on the Python Poisson regressions. 1.0 is the value every
  # recorded experiment used; it roughly halves the coefficients vs. an
  # unpenalized fit (see docs/PROGRESS.md, 2026-10-05). Set to 0.01 to
  # reproduce the robustness check. Choosing it properly needs a
  # validation split INSIDE the training seasons -- never the holdout.
  poisson_alpha: 1.0

# -----------------------------------------------------------------------------
# Evaluation
# -----------------------------------------------------------------------------
# Chronological train/test split: the most recent complete season is held out
# entirely from training and used only for scoring. Never a random split --
# this is time-series data and shuffling would leak the future into training.
evaluation:
  holdout_season: 2526
  # Walk-forward test seasons (2026-10-17 derby analysis): each is predicted
  # by a model trained ONLY on the seasons before it, so every prediction is
  # out-of-sample and the pooled sample is ~3x the single holdout season.
  walk_forward_test_seasons: [2324, 2425, 2526]

# -----------------------------------------------------------------------------
# Derby / rivalry definitions (2026-10-17 research question)
# -----------------------------------------------------------------------------
# Fixed BEFORE any derby result was computed, so the definition can't be
# tuned to the answer. EPL pairings only: the dataset is EPL-only
# (active.leagues), so Milan-Inter / Real Madrid-Atletico aren't testable
# without adding leagues, which is a separate scope decision.
#
# Team names must match the Silver matches table exactly. A pairing is
# unordered: Arsenal-Tottenham and Tottenham-Arsenal are both the derby.
derbies:
  # PRIMARY: a "local derby" = both clubs in the same metropolitan area
  # (Greater London or one of the English metropolitan counties). A
  # geographic rule rather than a judgment call, and the largest sample.
  # Areas with only one club in the data (West Yorkshire: Leeds; South
  # Yorkshire: Sheffield United) are omitted, as they can't produce a derby.
  primary_definition: "local"
  metro_areas:
    London: ["Arsenal", "Brentford", "Chelsea", "Crystal Palace", "Fulham",
             "Tottenham Hotspur", "West Ham United"]
    Manchester: ["Manchester City", "Manchester United"]
    Merseyside: ["Liverpool", "Everton"]
    West Midlands: ["Aston Villa", "Wolverhampton Wanderers"]
    Tyne and Wear: ["Newcastle United", "Sunderland"]
  # SENSITIVITY 1: the three classic same-city derbies the research plan
  # names. The most intense rivalries; tiny sample (2 meetings per season).
  classic:
    Manchester derby: ["Manchester City", "Manchester United"]
    North London derby: ["Arsenal", "Tottenham Hotspur"]
    Merseyside derby: ["Liverpool", "Everton"]
  # SENSITIVITY 2: established, named rivalries, including ones between
  # different cities. Tests "rivalry intensity" instead of "same city".
  rivalry:
    Manchester derby: ["Manchester City", "Manchester United"]
    North London derby: ["Arsenal", "Tottenham Hotspur"]
    Merseyside derby: ["Liverpool", "Everton"]
    North-West derby: ["Liverpool", "Manchester United"]
    Tyne-Wear derby: ["Newcastle United", "Sunderland"]
    M23 derby: ["Brighton", "Crystal Palace"]
    West Midlands derby: ["Aston Villa", "Wolverhampton Wanderers"]
    East Midlands derby: ["Nottingham Forest", "Leicester City"]
    Roses rivalry: ["Leeds", "Manchester United"]
